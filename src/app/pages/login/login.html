<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="assets/images/logo-dark.svg" alt="logo" class="logo" />

      <h3 class="mt-3">
        <b>Login</b>
      </h3>
    </div>

    <div class="form-group mb-3">
      <label class="mb-2">Username</label>

      <input type="text" class="form-control" [(ngModel)]="username" placeholder="Masukkan username" />
    </div>

    <div class="form-group mb-4">
      <label class="mb-2">Password</label>

      <div class="password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control pe-5"
          [(ngModel)]="password"
          placeholder="Masukkan password"
        />

        <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
          <i class="fa" [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
        </button>
      </div>
    </div>

    <div class="d-grid">
      <button class="btn btn-primary" (click)="onLogin()">Login</button>
    </div>
  </div>
</div>
