<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="assets/images/logo-dark.svg" alt="logo" class="logo" />

      <h3 class="mt-3">
        <b>Login</b>
      </h3>
    </div>

    <div class="form-group mb-3">
      <label class="mb-2">Username</label>

      <input type="text" class="form-control" [(ngModel)]="username" placeholder="Masukkan username" />
    </div>

    <div class="form-group mb-4">
      <label class="mb-2">Password</label>

      <input type="password" class="form-control" [(ngModel)]="password" placeholder="Masukkan password" />
    </div>

    <div class="d-grid">
      <button class="btn btn-primary" (click)="onLogin()">Login</button>
    </div>
  </div>
</div>
